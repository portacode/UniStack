{% extends 'core/base.html' %}
{% block content %}<div class="auth-page"><section class="auth-card"><div class="eyebrow">{{ brand.name }}</div><h1>Welcome back.</h1><p class="lead">Sign in to your workspace.</p><form method="post">{% csrf_token %}{% if form.errors %}<p class="form-error" role="alert">The username or password wasn’t recognized. Please try again.</p>{% endif %}<label for="id_username">Username</label><input id="id_username" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}"><label for="id_password">Password</label><input id="id_password" name="password" type="password" autocomplete="current-password" required><input type="hidden" name="next" value="{{ next }}"><button class="button primary" type="submit">Sign in</button></form></section></div>{% endblock %}
