source_template: ubuntu
name: UniStack
hostname: unistack
username: root
requires_codex_connection: true
resources:
  disk_gib: 12
  ram_mib: 3072
  cpus: 2
inputs:
  - id: unistack_allow_anonymous_chat
    type: boolean
    label: Anonymous visitors can access AI chat
    required: false
    default: true
    description: Let visitors chat immediately. AI usage is charged to your connected Portacode account. Turn off to require sign-in.
  - id: project_slug
    type: text
    label: Project name
    required: false
    default: my-project
    description: Optional folder name, such as my-app. Use lowercase letters, numbers, and hyphens.
  - id: django_superuser_username
    type: text
    label: Django admin username
    required: true
    default: admin
    description: Username for the initial Django superuser.
  - id: django_superuser_email
    type: email
    label: Django admin email
    required: true
    description: Email address for the initial Django superuser.
  - id: django_superuser_password
    type: secret
    label: Django admin password
    required: true
    description: Password for the initial Django superuser.
automation_task:
  task_name: Deploy UniStack
  instructions:
    - run: docker compose version
    - run: portacode github-setup
    - run: git clone --recurse-submodules https://github.com/portacode/UniStack.git "$HOME/.unistack-template" && python3 "$HOME/.unistack-template/scripts/create_project.py"
    - run: cd "$HOME/${PROJECT_SLUG:-my-project}" && ./scripts/deploy.sh
    - run: cd "$HOME/${PROJECT_SLUG:-my-project}" && docker compose exec -T web python scripts/ensure_superuser.py
    - wait_for: https://[exposed:8000]/health/
      timeout: 1200
    - run: cd "$HOME/${PROJECT_SLUG:-my-project}" && test ! -e .git && pwd -P
      register_project: true
  expose_ports:
    - 8000
  on_success: notify
  on_failure: suggest_fixes
