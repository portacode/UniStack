source_template: ubuntu
name: UniStack
hostname: unistack
username: root
requires_codex_connection: true
resources:
  disk_gib: 12
  ram_mib: 1536
  cpus: 0.5
inputs:
  - id: brand_name
    type: text
    label: App name
    required: false
    default: Workspace
  - id: brand_tagline
    type: text
    label: Short description
    required: false
    default: A place to get things done.
  - id: brand_logo
    type: image
    label: Logo (optional)
    required: false
    accept: image/png,image/jpeg,image/webp
    description: PNG, JPEG or WebP, up to 5 MiB. Shared by the website and assistant.
  - id: brand_primary
    type: color
    label: Primary brand color
    required: false
    default: '#3157d5'
  - id: brand_accent
    type: color
    label: Accent brand color
    required: false
    default: '#0f766e'
  - id: unistack_allow_anonymous_chat
    type: boolean
    label: Let visitors try AI chat before signing up
    required: false
    default: true
    description: When enabled, visitors can chat without an account and their conversations transfer when they sign up or sign in from the same browser. Turn off to require sign-in. AI usage is charged to your connected Portacode account.
  - id: project_slug
    type: text
    label: Project name
    required: false
    default: my-project
    description: Optional folder name, such as my-app. Use lowercase letters, numbers, and hyphens.
  - id: unistack_allow_signup
    type: boolean
    label: Allow visitors to create accounts
    required: false
    default: true
    description: Turn off for an invite-only app. Sign-in remains available and signup links are hidden automatically.
  - id: django_superuser_username
    type: text
    label: Django admin username
    required: true
    default: admin
    description: Username for the initial Django superuser.
  - id: django_superuser_email
    type: email
    label: Django admin email
    required: true
    description: Email address for the initial Django superuser.
  - id: django_superuser_password
    type: secret
    label: Django admin password
    required: true
    description: Password for the initial Django superuser.
automation_task:
  task_name: Deploy UniStack
  instructions:
    - run: docker compose version
    - run: portacode github-setup
    - run: git clone --recurse-submodules https://github.com/portacode/UniStack.git "$HOME/.unistack-template" && python3 "$HOME/.unistack-template/scripts/create_project.py"
    - run: cd "$HOME/${PROJECT_SLUG:-my-project}" && ./scripts/deploy.sh
    - wait_for: https://[exposed:8000]/health/
      timeout: 1200
    - run: cd "$HOME/${PROJECT_SLUG:-my-project}" && test ! -e .git && pwd -P
      register_project: true
  expose_ports:
    - 8000
  on_success: notify
  on_failure: suggest_fixes
