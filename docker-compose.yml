services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unistack
      POSTGRES_USER: unistack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unistack-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unistack -d unistack"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      RUN_MIGRATIONS: "0"
    command: ["python", "manage.py", "run_worker"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
